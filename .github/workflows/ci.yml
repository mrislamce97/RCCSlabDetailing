name: AutoLISP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate AutoLISP source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check source file and balanced syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          path = Path("2WSLAB.LSP")
          if not path.is_file():
              sys.exit(f"ERROR: {path} was not found")

          try:
              source = path.read_text(encoding="ascii")
          except UnicodeDecodeError as error:
              sys.exit(f"ERROR: {path} must contain ASCII text: {error}")

          if not source.strip():
              sys.exit(f"ERROR: {path} is empty")

          depth = 0
          in_string = False
          escaped = False
          in_comment = False
          line = 1

          for char in source:
              if char == "\n":
                  line += 1
                  in_comment = False
                  continue

              if in_comment:
                  continue

              if in_string:
                  if escaped:
                      escaped = False
                  elif char == "\\":
                      escaped = True
                  elif char == '"':
                      in_string = False
                  continue

              if char == ";":
                  in_comment = True
              elif char == '"':
                  in_string = True
              elif char == "(":
                  depth += 1
              elif char == ")":
                  depth -= 1
                  if depth < 0:
                      sys.exit(f"ERROR: unexpected ')' on line {line}")

          if in_string:
              sys.exit("ERROR: unterminated string")
          if depth != 0:
              sys.exit(f"ERROR: unbalanced parentheses (final depth: {depth})")

          print(f"Validated {path}: ASCII text and balanced parentheses")
          PY
